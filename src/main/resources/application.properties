spring.application.name=cpi-backend

# Railway provides individual PG* variables when PostgreSQL is attached.
# We construct the JDBC URL from these components because Railway's DATABASE_URL
# uses postgresql:// format which is incompatible with Spring Boot's jdbc:postgresql:// format.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:127.0.0.1}:${PGPORT:5432}/${PGDATABASE:cpi_db}}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Optimization for Supabase / Railway Cloud PostgreSQL
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:8f2a5c4e9d7b1a3f6c8e0d2b4a6f8c0e2d4b6a8c0e2d4f6a8c0e2d4f6a8c0e2d}
jwt.expiration=86400000

# Railway dynamically assigns PORT. Fall back to 8080 for local dev.
server.port=${PORT:8080}

# AI Microservice URL (FastAPI on Railway)
ai.service.url=${AI_SERVICE_URL:https://innovative-gratitude-production-1375.up.railway.app}

# Redis Cache Configuration (Railway Redis integration)
spring.data.redis.url=${REDIS_URL:${REDIS_PUBLIC_URL:}}
spring.data.redis.host=${REDISHOST:127.0.0.1}
spring.data.redis.port=${REDISPORT:6379}
spring.data.redis.password=${REDISPASSWORD:}
spring.data.redis.timeout=2000ms

# Spring Cache Configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

# Max payload size for image upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=10MB

# Enable Gzip HTTP Response Compression for fast network transfers
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.compression.min-response-size=256

# High-Performance Tomcat Thread Pool & Connection Tuning
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.connection-timeout=5000
server.tomcat.max-connections=10000
server.tomcat.accept-count=200




